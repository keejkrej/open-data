[project]
name = "open-data-viz"
version = "0.1.0"
description = "Render StatsBomb Open Data events as PNG frames and MP4 video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "Pillow>=10.0",
]

[project.scripts]
viz-events = "open_data_viz.visualize_events:main"

[tool.uv]
package = true
